<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conductivity Red Theme Previews</title>
<style>
:root{
  --red:#E5322D; --red-d:#B8211D; --red-l:#FDE9E8;
  --blue:#0A47A9; --blue-d:#06307a;
  --bg:#fff; --bg2:#F7F4F3; --ink:#14181F; --mute:#5E6672;
  --hero-bg:#E5322D; --hero-ink:#fff; --accent:#E5322D; --accent-ink:#fff;
  --link:#E5322D; --card:#fff; --line:rgba(20,24,31,.1); --band:#0A47A9; --band-ink:#fff;
  --radius:18px;
}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#1c1f26;color:var(--ink)}

/* ---------- control bar (not part of the site) ---------- */
.ctl{position:sticky;top:0;z-index:100;background:#0f1218;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;border-bottom:1px solid #2a2f3a}
.ctl h1{font-size:13px;font-weight:600;letter-spacing:.04em;opacity:.7;width:100%}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp>span{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.55;margin-right:2px}
.ctl button{font:inherit;font-size:13px;color:#fff;background:#232834;border:1px solid #333a48;border-radius:999px;padding:6px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.ctl button:hover{background:#2c3342}
.ctl button[aria-pressed=true]{background:#fff;color:#0f1218;border-color:#fff}
.sw{display:inline-flex}.sw i{width:11px;height:11px;border-radius:50%;margin-right:-3px;border:1.5px solid #0f1218}
.ctl .note{font-size:12px;opacity:.55;margin-left:auto}

.frame{max-width:1280px;margin:18px auto;background:var(--bg);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}

/* ---------- site mock ---------- */
.s{color:var(--ink);background:var(--bg);line-height:1.5}
.s a{color:inherit;text-decoration:none}
.w{max-width:1100px;margin:0 auto;padding:0 28px}
.sec{padding:72px 0}
.alt{background:var(--bg2)}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--accent)}
.s h2{font-size:clamp(26px,3.4vw,38px);line-height:1.15;letter-spacing:-.02em;margin-top:8px}
.s h3{font-size:18px}
.mute{color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 22px;font-weight:600;font-size:14px;border:1.5px solid transparent;cursor:pointer}
.b1{background:var(--accent);color:var(--accent-ink)}
.b2{border-color:currentColor}
.b3{background:var(--blue);color:#fff}
.card{background:var(--card);border-radius:var(--radius);padding:26px;border:1px solid var(--line)}
.ico{width:44px;height:44px;border-radius:12px;background:var(--red-l);color:var(--red-d);display:grid;place-items:center;font-size:20px;margin-bottom:14px}
.grid{display:grid;gap:20px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.ph{border-radius:var(--radius);background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.06)),var(--blue);display:grid;place-items:center;color:rgba(255,255,255,.85);font-size:13px;text-align:center;padding:16px;min-height:300px}

/* header */
.hd{display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 28px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:24px;letter-spacing:-.03em;color:var(--blue)}
.logo b{color:var(--red);font-weight:900}
.nav{display:flex;gap:4px;font-size:14px;font-weight:500}
.nav a{padding:8px 12px;border-radius:999px;color:var(--mute);cursor:pointer}
.nav a.on{color:var(--accent);background:var(--red-l)}
.hd.dark{background:var(--ink);border-color:transparent}.hd.dark .logo{color:#fff}.hd.dark .nav a{color:rgba(255,255,255,.7)}.hd.dark .nav a.on{background:rgba(255,255,255,.12);color:#fff}
.hd.redbar{background:var(--red);border:0}.hd.redbar .logo,.hd.redbar .logo b{color:#fff}.hd.redbar .nav a{color:rgba(255,255,255,.85)}.hd.redbar .nav a.on{background:rgba(255,255,255,.2);color:#fff}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,5vw,60px);line-height:1.05;letter-spacing:-.03em;font-weight:800}
.hero p.lead{font-size:18px;opacity:.85;max-width:520px;margin-top:18px}
.hero .eyebrow{color:inherit;opacity:.8}
.hero .btn.b1{background:var(--hero-ink);color:var(--hero-bg)}
.hero.split .w{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding-top:84px;padding-bottom:84px}
.hero.center .w{text-align:center;padding-top:96px;padding-bottom:96px}
.hero.center p.lead{margin-left:auto;margin-right:auto}
.hero.center .acts{justify-content:center}
.hero.edit .w{padding-top:90px;padding-bottom:70px}
.hero.edit h1{font-size:clamp(44px,8vw,104px);line-height:.98;max-width:900px}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none}

/* stats / band */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center}
.stats b{display:block;font-size:40px;letter-spacing:-.03em}
.band{background:var(--band);color:var(--band-ink)}
.band .eyebrow{color:inherit;opacity:.7}

/* editorial rows */
.row{display:grid;grid-template-columns:70px 1fr 1.4fr 30px;gap:20px;align-items:center;padding:22px 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row .n{font-size:14px;color:var(--accent);font-weight:700}
.row h3{font-size:24px;letter-spacing:-.01em}

.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.steps div{position:relative;padding-top:16px;border-top:3px solid var(--accent)}
.steps b{display:block;margin-bottom:4px}

.ft{background:var(--ink);color:rgba(255,255,255,.7);padding:44px 0;font-size:14px}
.ft .logo{color:#fff}
.ft .cols{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}

.form{display:grid;gap:14px}
.form input,.form textarea{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.form textarea{min-height:120px}

.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--red-l);color:var(--red-d)}

@media(max-width:820px){
  .g3,.g4,.g2,.steps,.stats{grid-template-columns:1fr 1fr}
  .hero.split .w{grid-template-columns:1fr}
  .row{grid-template-columns:40px 1fr}.row p,.row>span:last-child{display:none}
  .nav{display:none}
}
</style>
</head>
<body>

<div class="ctl">
  <h1>CONDUCTIVITY · RED THEME PREVIEW — pick any palette × layout × page</h1>
  <div class="grp" id="gp"><span>Palette</span></div>
  <div class="grp" id="gl"><span>Layout</span></div>
  <div class="grp" id="gg"><span>Page</span></div>
  <div class="note" id="label"></div>
</div>

<div class="frame"><div class="s" id="site"></div></div>

<script>
const palettes = {
  logo: {name:"1 · Logo Red + Blue", dots:["#E5322D","#0A47A9","#fff"], v:{
    "--accent":"#E5322D","--hero-bg":"#E5322D","--hero-ink":"#fff","--band":"#0A47A9","--bg2":"#F7F4F3","--ink":"#14181F"}},
  navy: {name:"2 · Navy Hero, Red Accent", dots:["#0A2A6B","#E5322D","#fff"], v:{
    "--accent":"#E5322D","--hero-bg":"#0A2A6B","--hero-ink":"#fff","--band":"#E5322D","--bg2":"#F3F6FB","--ink":"#0E1A33"}},
  ember: {name:"3 · Ember Dark", dots:["#0F1115","#FF3B30","#2A2D35"], v:{
    "--accent":"#FF3B30","--hero-bg":"#0F1115","--hero-ink":"#fff","--band":"#FF3B30","--bg2":"#F4F4F5","--ink":"#0F1115","--red-l":"#FFE9E7"}},
  brick: {name:"4 · Brick & Cream", dots:["#9E2B25","#F6EEE3","#1F1A17"], v:{
    "--accent":"#9E2B25","--hero-bg":"#9E2B25","--hero-ink":"#FBF4EA","--band":"#1F1A17","--bg":"#FBF4EA","--bg2":"#F3E8D8","--ink":"#1F1A17","--red-l":"#F6DDD6","--card":"#FFFBF4"}},
  rose: {name:"5 · Soft Rose & Crimson", dots:["#FFF1F0","#D7263D","#7A0F1F"], v:{
    "--accent":"#D7263D","--hero-bg":"#FFF1F0","--hero-ink":"#3A0A12","--band":"#7A0F1F","--bg":"#fff","--bg2":"#FFF6F5","--ink":"#2B0A10","--red-l":"#FFE0E2","--blue":"#7A0F1F"}},
};
const layouts = {
  split:{name:"A · Split hero + cards"},
  center:{name:"B · Centered bold + stats"},
  edit:{name:"C · Editorial / big type"},
};
const pages = {home:"Home",services:"Services",contact:"Contact"};
let st = {p:"logo",l:"split",g:"home"};

const svc = [
 ["🧭","Career Services","One-to-one support for people at every stage of their career."],
 ["👥","HR Consulting","Practical HR systems that organizations can actually run."],
 ["🏛","Organizational Development","Structure, governance and capability for lasting performance."],
 ["🎓","Training & Development","Programs that build skills people use on Monday morning."],
 ["🤝","Talent Solutions","The right talent, matched to the right requirement."],
 ["🌍","Mobility Services","Pathways for careers that cross borders."],
];
const steps=[["Understand","Listen first."],["Assess","Evidence over opinion."],["Develop","Close the gaps."],["Connect","People ↔ opportunity."],["Deliver","Measured outcomes."]];

const logo = `<span class="logo">C<b>o</b>nductivity</span>`;
const cap = (t)=>`<div class="ph">${t}<br><small style="opacity:.7">Replace with real photo</small></div>`;

function header(){
  const cls = st.p==="ember"?"dark":(st.p==="logo"&&st.l==="center")?"redbar":"";
  const items=["Home","About","Services","Sanjeeda","Events","Facilities","Insights","Contact"];
  const on = {home:"Home",services:"Services",contact:"Contact"}[st.g];
  return `<div class="hd ${cls}">${logo}<nav class="nav">${items.map(i=>`<a class="${i===on?'on':''}">${i}</a>`).join("")}</nav><a class="btn b1" style="padding:9px 18px">Explore Sanjeeda</a></div>`;
}
function footer(){return `<div class="ft"><div class="w cols"><div>${logo}<p style="margin-top:8px;max-width:280px">Connecting people, organizations and opportunity.</p></div><div>info@conductivity.com.pk<br>Lahore, Pakistan</div></div></div>`}

function hero(){
  const h1="Connecting people, organizations and opportunity.";
  const lead="A connected career and HR ecosystem — helping people grow, organizations perform, and the right talent meet the right opportunity.";
  const acts=`<div class="acts"><a class="btn b1">Explore Services</a><a class="btn b2">Contact Us</a></div>`;
  const blobs=`<div class="blob" style="width:340px;height:340px;background:#fff;opacity:.12;right:-60px;top:-80px"></div>`;
  if(st.l==="split") return `<section class="hero split">${blobs}<div class="w"><div><p class="eyebrow">Career · HR · Talent · Organizations</p><h1 style="margin-top:14px">${h1}</h1><p class="lead">${lead}</p>${acts}</div>${cap("Team & workspace image")}</div></section>`;
  if(st.l==="center") return `<section class="hero center">${blobs}<div class="w"><p class="eyebrow">Career · HR · Talent · Organizations</p><h1 style="margin:14px auto 0;max-width:820px">${h1}</h1><p class="lead">${lead}</p>${acts}</div></section>`;
  return `<section class="hero edit"><div class="w"><p class="eyebrow">Conductivity Consultancy Pvt. Ltd</p><h1 style="margin-top:18px">Where careers and organizations <u style="text-decoration-thickness:6px;text-underline-offset:10px">connect.</u></h1><p class="lead">${lead}</p>${acts}</div></section>`;
}

function servicesBlock(){
  if(st.l==="edit") return `<section class="sec"><div class="w"><p class="eyebrow">What we do</p><h2 style="margin-bottom:34px">Six service areas, one ecosystem</h2>${svc.map((s,i)=>`<div class="row"><span class="n">0${i+1}</span><h3>${s[1]}</h3><p class="mute">${s[2]}</p><span>→</span></div>`).join("")}</div></section>`;
  return `<section class="sec alt"><div class="w"><p class="eyebrow">What we do</p><h2 style="margin-bottom:34px">Six service areas, one ecosystem</h2><div class="grid g3">${svc.map(s=>`<div class="card"><div class="ico">${s[0]}</div><h3>${s[1]}</h3><p class="mute" style="margin-top:6px;font-size:15px">${s[2]}</p><p style="margin-top:14px;color:var(--accent);font-weight:600;font-size:14px">Learn more →</p></div>`).join("")}</div></div></section>`;
}
function statsBlock(){
  return `<section class="sec band"><div class="w stats"><div><b>6</b>Service areas</div><div><b>2</b>Sides: people & orgs</div><div><b>5</b>Step method</div><div><b>1</b>Connected ecosystem</div></div></section>`;
}
function sanjeeda(){
  return `<section class="sec band"><div class="w grid g2" style="align-items:center;gap:40px"><div><p class="eyebrow">Sanjeeda · by Conductivity</p><h2>Become ready for the opportunities that matter.</h2><p style="margin-top:14px;opacity:.8;font-size:17px">Our career-readiness platform — a guided journey from self-understanding to career growth.</p><div class="acts"><a class="btn b1" style="background:#fff;color:var(--band)">Explore Sanjeeda ↗</a></div></div><div class="grid g3" style="gap:10px">${["Discover","Prepare","Guide","Evaluate","Connect","Grow"].map((x,i)=>`<div style="background:rgba(255,255,255,.14);border-radius:14px;padding:16px"><small style="opacity:.7">0${i+1}</small><br><b>${x}</b></div>`).join("")}</div></div></section>`;
}
function how(){
  return `<section class="sec"><div class="w"><p class="eyebrow">How we work</p><h2 style="margin-bottom:30px">Understand → Assess → Develop → Connect → Deliver</h2><div class="steps">${steps.map(s=>`<div><b>${s[0]}</b><span class="mute" style="font-size:14px">${s[1]}</span></div>`).join("")}</div></div></section>`;
}
function insights(){
  return `<section class="sec alt"><div class="w"><p class="eyebrow">Insights</p><h2 style="margin-bottom:30px">Latest knowledge</h2><div class="grid g3">${[["Career","Seven CV mistakes that quietly cost you interviews"],["HR","What an HR audit should actually tell you"],["Future of Work","The skills that will outlast the next tool"]].map(i=>`<div class="card"><span class="chip">${i[0]}</span><h3 style="margin-top:12px">${i[1]}</h3></div>`).join("")}</div></div></section>`;
}
function cta(){
  return `<section class="sec"><div class="w"><div class="hero" style="border-radius:26px;padding:56px 32px;text-align:center"><h2 style="font-size:34px;margin:0">Let's connect the right people and opportunities.</h2><div class="acts" style="justify-content:center"><a class="btn b1">Contact Us</a><a class="btn b2">Explore Services</a></div></div></div></section>`;
}

function home(){
  const mid = st.l==="center"?statsBlock():"";
  return hero()+servicesBlock()+mid+sanjeeda()+how()+insights()+cta();
}
function servicesPage(){
  const top = `<section class="hero ${st.l==='edit'?'edit':'split'}" style="${st.l==='center'?'text-align:center':''}"><div class="w" style="${st.l==='split'?'display:block;padding-top:64px;padding-bottom:64px':st.l==='center'?'padding-top:64px;padding-bottom:64px':'padding-top:64px;padding-bottom:40px'}"><p class="eyebrow">Services</p><h1 style="margin-top:12px;${st.l==='edit'?'font-size:clamp(40px,6vw,80px)':'font-size:clamp(32px,4.5vw,50px)'}">Practical help for people and organizations.</h1></div></section>`;
  return top+servicesBlock()+how()+cta();
}
function contactPage(){
  return `<section class="hero ${st.l==='edit'?'edit':''}" style="${st.l==='center'?'text-align:center':''}"><div class="w" style="padding-top:56px;padding-bottom:56px;display:block"><p class="eyebrow">Contact</p><h1 style="margin-top:12px;font-size:clamp(32px,4.5vw,50px)">Tell us what you need.</h1></div></section>
  <section class="sec"><div class="w grid g2" style="gap:44px;${st.l==='edit'?'grid-template-columns:1fr 1.2fr':''}"><div><h2>Get in touch</h2><p class="mute" style="margin-top:12px">A career plan, an HR project, a training program or a talent search — we'll reply within two working days.</p><p style="margin-top:22px"><b>Email</b><br>info@conductivity.com.pk</p><p style="margin-top:14px"><b>Office</b><br>Address — to be confirmed</p></div><div class="card"><div class="form"><input placeholder="Full name"><input placeholder="Email"><textarea placeholder="How can we help?"></textarea><a class="btn b1" style="justify-content:center">Send message</a></div></div></div></section>`;
}

function render(){
  const root=document.documentElement.style;
  // reset to defaults first, then apply palette
  ["--accent","--hero-bg","--hero-ink","--band","--bg","--bg2","--ink","--red-l","--card","--blue"].forEach(k=>root.removeProperty(k));
  Object.entries(palettes[st.p].v).forEach(([k,v])=>root.setProperty(k,v));
  const body = st.g==="home"?home():st.g==="services"?servicesPage():contactPage();
  document.getElementById("site").innerHTML = header()+body+footer();
  document.getElementById("label").textContent = `${palettes[st.p].name} · ${layouts[st.l].name} · ${pages[st.g]}`;
  document.querySelectorAll(".ctl button").forEach(b=>b.setAttribute("aria-pressed", st[b.dataset.k]===b.dataset.v));
}
function mk(id,k,obj,dots){
  const el=document.getElementById(id);
  Object.entries(obj).forEach(([key,val])=>{
    const b=document.createElement("button");b.dataset.k=k;b.dataset.v=key;
    b.innerHTML=(dots?`<span class="sw">${val.dots.map(c=>`<i style="background:${c}"></i>`).join("")}</span>`:"")+(val.name||val);
    b.onclick=()=>{st[k]=key;render();window.scrollTo({top:0})};
    el.appendChild(b);
  });
}
mk("gp","p",palettes,true);mk("gl","l",layouts);mk("gg","g",pages);
render();
</script>
</body>
</html>
